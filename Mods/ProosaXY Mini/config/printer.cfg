#  \___/\/ |_.__/ \___|\__,_|    

[extruder]
step_pin: ebb:PD0
dir_pin: !ebb:PD1
enable_pin: !ebb:PD2
# Sherpa mini
rotation_distance: 22.67895
gear_ratio: 50:10
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 250
max_extrude_cross_section: 50
min_temp: -10
max_temp: 310
max_power: 1.0
min_extrude_temp: 150
#smooth_time: 2.0
heater_pin: PB1
sensor_pin:  ebb:PA3
sensor_type: ATC Semitec 104GT-2
#control: pid
#pid_Kp: 33.265
#pid_Ki: 14.784
#pid_Kd: 18.711

[tmc2209 extruder]
uart_pin: ebb:PA15
run_current: 0.750
hold_current: 0.150
sense_resistor: 0.110
interpolate: false
stealthchop_threshold: 0

[heater_bed]
heater_pin: PB0 # bed
sensor_pin: PA4 # TB
sensor_type: Generic 3950
control: pid
pid_Kp: 120
pid_Ki: 1.5
pid_Kd: 600
min_temp: 10
max_temp: 110

#  _                   _ _             
# | |    _____   _____| (_)_ __   __ _ 
# | |   / _ \ \ / / _ \ | | '_ \ / _` |
# | |__|  __/\ V /  __/ | | | | | (_| |
# |_____\___| \_/ \___|_|_|_| |_|\__, |
#                                |___/ 

[probe]
pin: PA8
x_offset: 28.5
y_offset: -4
#z_offset: 0.0
speed: 10 #7.5
samples: 2
sample_retract_dist: 0.5
samples_result: median
samples_tolerance: 0.050
samples_tolerance_retries: 2
#activate_gcode:
#deactivate_gcode:

[safe_z_home]
home_xy_position: 90,90
z_hop: 6

[z_tilt]
# the point of the motor (or leadscrew)
z_positions:
	220, 90
	-25, 90
points:
    140, 90
	1.5, 90
speed: 100
horizontal_move_z: 10
retries: 10
retry_tolerance: 0.015

[bed_mesh]
algorithm: bicubic
fade_end: 10
horizontal_move_z: 2
mesh_max: 160,150
mesh_min: 30, 30
#mesh_pps: 3
probe_count: 3,3
speed: 400
adaptive_margin: 5

#  _____               
# |  ___|_ _ _ __  ___ 
# | |_ / _` | '_ \/ __|
# |  _| (_| | | | \__ \
# |_|  \__,_|_| |_|___/

#	Hotend Fan
[heater_fan hotend_fan]
pin: PE9
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
shutdown_speed: 1
tachometer_pin: PE14

# Print fan
[fan]
pin: ebb:PA0
kick_start_time: 0.5
off_below: 0.05

# Buddy board fan
[controller_fan controller_fan]
pin: PE11
kick_start_time: 0.5
heater: extruder
max_power: 1


