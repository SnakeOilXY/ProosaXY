# This config is intended to be used with Prusa buddy board and BTT EBB42, if you want to
# use different MCU you need to check the pins

# This config is intended to be paired with tradrack config to have working filament sensor
# If you want standard IR filament sensor just plug the IR sensor on buddy board and uncoment
# the filament section of this config.

# Do not use adaptive mesh or KAMP plugins. The standard 3x3 bed mesh is fast enough and avoid
# the magnet field of the underbed magnets, leave the bed_mesh section unchanged if you don't
# know what are you doing

# This config uses TR8X8 leadscrew motors for Z, because for me it's cheaper than buy other
# TR8x4, I have a bunch of old MK3s Z motors.

# This config uses OMC HE19 2A steppers to max out the printer capabilities, it's a cheap upgrade
# 20€/25$ for a pair of good steppers or less.

#                  __ _ _       _     _          _               _    
#  _ __  _ __ ___ / _| (_) __ _| |__ | |_    ___| |__   ___  ___| | __
# | '_ \| '__/ _ \ |_| | |/ _` | '_ \| __|  / __| '_ \ / _ \/ __| |/ /
# | |_) | | |  __/  _| | | (_| | | | | |_  | (__| | | |  __/ (__|   < 
# | .__/|_|  \___|_| |_|_|\__, |_| |_|\__|  \___|_| |_|\___|\___|_|\_\
# |_|                     |___/                                       

# Replace the IDs of the MCU's with yours on MCU section

# 1- This config comes with input shaper activated, with the values of standard proosaXY, works
# 2- with ProosaXY mini well but need to be tuned with real values.
# 3- Ensure the buddy fan is working to avoid overheating, it's critical, low temps when on,
# high temps if not.
# 4- If you are using TR8x4 leadscrew change this on Stepper section put rotation_distance: 4
# 5- If you are using OEM 1A high inductance steppers change this on Stepper section
# 5- Redo the PID for the extruder heater.
# 6- Do not forget to put your print_start/print_end macro ;)

[include mainsail.cfg]
[pause_resume]
[exclude_object]

[idle_timeout]
timeout: 1200
    
#[include config/plugins/tradrack/*.cfg]

[virtual_sdcard]
path: ~/printer_data/gcodes

#  __  __  ____ _   _ 
# |  \/  |/ ___| | | |
# | |\/| | |   | | | |
# | |  | | |___| |_| |
# |_|  |_|\____|\___/ 

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_56003A001150315239353820-if00

[mcu ebb]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_410012000250505539323520-if00

[display]
lcd_type: st7789v
spi_bus: spi2a
rst_pin: PC8
cs_pin: PC9
rs_pin: PD11
encoder_pins: ^PE13, ^PE15
click_pin: ^!PE12
display_group: _default_20x4

[temperature_sensor buddy_board]
sensor_type: temperature_mcu
sensor_mcu: mcu
min_temp: 10
max_temp: 100

[temperature_sensor ebb]
sensor_type: temperature_mcu
sensor_mcu: ebb
min_temp: 10
max_temp: 100

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

#  ____       _       _            
# |  _ \ _ __(_)_ __ | |_ ___ _ __ 
# | |_) | '__| | '_ \| __/ _ \ '__|
# |  __/| |  | | | | | ||  __/ |   
# |_|   |_|  |_|_| |_|\__\___|_|   

# Standard ProosaXY IS
[input_shaper]
shaper_freq_x: 58.2
shaper_type_x: mzv
shaper_freq_y: 42.8
shaper_type_y: mzv

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 20000
#max_accel_to_decel: 15000
max_z_velocity: 25
max_z_accel: 1000
square_corner_velocity: 25

#  ____  _                             
# / ___|| |_ ___ _ __  _ __   ___ _ __ 
# \___ \| __/ _ \ '_ \| '_ \ / _ \ '__|
#  ___) | ||  __/ |_) | |_) |  __/ |   
# |____/ \__\___| .__/| .__/ \___|_|   
#               |_|   |_|              

[stepper_x]
step_pin: PD1
dir_pin: PD0
enable_pin: !PD3
microsteps: 32 # Better quality, less noise
# microsteps: 16 # You may need if want to use OEM high inductance stepperrs
rotation_distance: 40
full_steps_per_rotation:200
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: -2
position_max: 193.5
position_min : -3
homing_speed: 40
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PD5
uart_address: 1
run_current: 1.000 # OMC HE19 2A Stepper
# run_current: 0.600 # OEM high inductance steppers
sense_resistor: 0.22
interpolate: false
stealthchop_threshold: 0
diag_pin: ^PE2
driver_SGTHRS: 100

[stepper_y]
step_pin: PD13
dir_pin: PD12
enable_pin: !PD14
microsteps: 32 # Better quality, less noise
# microsteps: 16 # You may need if want to use OEM high inductance stepperrs
rotation_distance: 40
full_steps_per_rotation:200
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -5
position_max: 190
position_min : -5
homing_speed: 40
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PD5
uart_address: 3
run_current: 1.000 # OMC HE19 2A Stepper
# run_current: 0.600 # OEM high inductance steppers
sense_resistor: 0.22
interpolate: false
stealthchop_threshold: 0
diag_pin: ^PE1
driver_SGTHRS: 100

[stepper_z]
step_pin: PD4
dir_pin: !PD15
enable_pin: !PD2
microsteps: 32
rotation_distance: 8 # TR8x8 leadscrew
#rotation_distance: 4 # TR8x4 leadscrew
full_steps_per_rotation:200 
position_max: 210
position_min : -5
homing_speed: 10
endstop_pin: probe:z_virtual_endstop

[tmc2209 stepper_z]
uart_pin: PD5
uart_address: 0
run_current: 0.35
sense_resistor: 0.22
interpolate: false
stealthchop_threshold: 99999

[stepper_z1]
step_pin: PD9
dir_pin: !PD8
enable_pin: !PD10
microsteps: 32
rotation_distance: 8 # TR8x8 leadscrew
#rotation_distance: 4 # TR8x4 leadscrew
full_steps_per_rotation:200

[tmc2209 stepper_z1]
uart_pin: PD5
uart_address: 2
run_current: 0.35
sense_resistor: 0.22
interpolate: false
stealthchop_threshold: 99999

